# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000
      min-spare: 30
  port: 8080
  servlet:
    context-path: /
    session:
      cookie:
        http-only: true

# enable 保持 false：knife4j 4.5.0 与当前 springdoc 3.x 开启增强会触发 getGroupConfigs NoSuchMethodError
# 主题样式通过自定义 doc.html + /icejz-knife4j.css 注入，不依赖增强模式
knife4j:
  enable: false
  setting:
    language: zh_cn
    custom-code: 500
    enable-footer-custom: false



# 禁用springdoc，主要用于生产环境
#springdoc:
#  api-docs:
#    enabled: false

spring:
  # 环境 dev|test|prod
  profiles:
    active: dev
  application:
    name: icejz-boot
  jackson:
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB

storage:
  enabled: true
  config:
    # 存储类型：local、aliyun、tencent、qiniu、huawei、minio
    type: local
    domain: http://localhost:8080
  local:
    path: D://upload

icejz:
  # 平台统一版本号（与前端 package.json / 根目录 VERSION 保持一致）
  version: 1.0.5
  name: ICEJZ
  xss:
    enabled: true
    exclude-urls:
      - /maku-generator/**
      - /icejz-generator/**
  security:
    # 8小时过期
    access-token-expire: 28800
    # 14天过期
    refresh-token-expire: 1209600
  sms:
    # true：验证码写入 Redis，不调用短信厂商；接口会回传验证码便于联调
    mock: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: net.icejz.*.entity
  global-config:
    # 数据库相关配置
    db-config:
      # ID自增
      id-type: AUTO
      # 逻辑已删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0
    banner: false
  # 原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  configuration-properties:
    prefix:
    blobType: BLOB
    boolValue: TRUE