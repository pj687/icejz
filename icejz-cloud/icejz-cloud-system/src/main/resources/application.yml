server:
  port: 8081

spring:
  application:
    name: icejz-cloud-system
  cloud:
    nacos:
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        server-addr: @nacos.server-addr@
        namespace: @nacos.namespace@
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        namespace: ${spring.cloud.nacos.discovery.namespace}
  config:
    import:
      - optional:nacos:datasource.yaml
      - optional:nacos:common.yaml
  mqtt:
    host: tcp://localhost:1883
    username: icejz
    password: icejz
    clientId: icejz_boot_service_dev
    default-topic: topic_default

storage:
  enabled: true
  config:
    # 存储类型：local、aliyun、tencent、qiniu、huawei、minio
    type: local
    domain: http://localhost:8080
  local:
    path: D://upload

icejz:
  version: 1.0.6
  name: ICEJZ
  sms:
    # true：验证码写入 Redis，不调用短信厂商；接口会回传验证码便于联调
    mock: true